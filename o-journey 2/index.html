<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O! Journey — путешествия под вас</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--blue:#214db5;--lime:#d5f455;--ink:#1b2637;--muted:#697689;--line:#e6eaf0;--bg:#f6f8fb;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,select,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #a6bfff;outline-offset:2px}.top{background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1000}.topin{max-width:1180px;margin:auto;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-weight:850;font-size:25px;letter-spacing:-1.3px}.brand b{color:var(--blue)}.brand small{font-size:12px;color:var(--muted);letter-spacing:0;font-weight:500;margin-left:8px}.nav{display:flex;gap:8px}.nav button{background:none;border:0;padding:9px 12px;border-radius:9px;color:var(--muted);font-weight:650}.nav button.active{background:#eaf0ff;color:var(--blue)}.wrap{max-width:1180px;margin:auto;padding:25px 20px 55px}.hero{background:var(--blue);border-radius:21px;padding:31px 34px;color:white}.hero h1{font-size:34px;letter-spacing:-1px;margin:0 0 8px}.hero p{color:#e4ebff;margin:0 0 19px}.search{background:white;border-radius:13px;padding:8px;display:flex;gap:9px}.search textarea{border:0;flex:1;min-height:62px;resize:vertical;padding:12px;color:var(--ink);outline:none}.primary{background:var(--lime);color:#1b2d4b;border:0;padding:13px 17px;border-radius:10px;font-weight:800}.blue{background:var(--blue);color:white;border:0;padding:11px 16px;border-radius:10px;font-weight:750}.secondary{background:white;color:var(--blue);border:1px solid #c8d4ee;padding:10px 13px;border-radius:10px;font-weight:650}.filters{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin:18px 0}.filters label{font-size:12px;color:var(--muted);display:grid;gap:5px}.filters input,.filters select{border:1px solid var(--line);border-radius:9px;padding:10px;background:white;color:var(--ink);min-width:125px}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 13px}.heading h2{font-size:23px;letter-spacing:-.5px;margin:0}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}.card.selected{border:2px solid var(--blue)}.image{height:150px;background-size:cover;background-position:center;background-color:#e8eff5}.content{padding:17px}.card h3{font-size:19px;margin:0 0 7px}.card p{color:var(--muted);margin:0 0 12px}.pill{display:inline-block;background:#edf3ff;border-radius:18px;color:var(--blue);font-weight:650;font-size:11px;padding:5px 9px}.status{display:inline-block;background:#fff5dc;color:#825f12;border-radius:6px;padding:5px 8px;font-size:11px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:19px;align-items:start}.panel{border:1px solid var(--line);background:white;border-radius:16px;padding:21px;margin-bottom:16px}.panel h2{font-size:21px;margin:0 0 15px}.panel h3{font-size:17px;margin:0 0 7px}.choice{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;align-items:start;gap:12px;margin:10px 0}.choice.selected{border-color:var(--blue);background:#f5f8ff}.choice input{accent-color:var(--blue);margin-top:5px}.choice label{flex:1;cursor:pointer}.price{font-size:21px;font-weight:800}.right{position:sticky;top:88px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.divider{border-top:1px solid var(--line);margin:16px 0}.map{height:365px;border-radius:13px;border:1px solid var(--line);background:#edf3eb}.map-fallback{height:100%;display:grid;place-content:center;text-align:center;padding:15px}.places{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.place{border:1px solid var(--line);background:white;padding:9px 11px;border-radius:9px;text-align:left}.place.active{border-color:var(--blue);color:var(--blue)}.itinerary{border-left:2px solid #c7d6f4;margin:11px 0 0 8px;padding:0 0 14px 15px}.itinerary b{display:block}.bubble{background:#eaf1fc;padding:10px 12px;border-radius:10px;color:#224b97;margin:12px 0;font-size:13px}.note{background:#fff8e7;border-radius:10px;padding:12px;font-size:12px;color:#795d27}.empty{padding:25px;border:1px dashed #c8d4ea;border-radius:12px;color:var(--muted);text-align:center}.actions{display:flex;gap:8px;flex-wrap:wrap}.footer{margin-top:30px;color:var(--muted);font-size:12px}.none{display:none!important}#toast{position:fixed;bottom:23px;left:50%;transform:translateX(-50%);background:#20314d;color:white;padding:12px 19px;border-radius:12px;z-index:9999;display:none;box-shadow:0 8px 25px #1b28442c}#weather{font-size:13px}.detail{font-size:13px;color:var(--muted)}@media(max-width:790px){.topin{padding:10px 12px;flex-wrap:wrap}.brand{font-size:22px}.brand small{display:none}.nav button{padding:8px 9px;font-size:13px}.wrap{padding:13px 12px}.hero{padding:24px 18px}.hero h1{font-size:27px}.search{display:block}.search textarea{width:100%;min-height:80px}.search button{width:100%}.grid{grid-template-columns:1fr}.layout{display:block}.right{position:static}.filters{display:grid;grid-template-columns:repeat(2,1fr)}.filters input,.filters select{width:100%;min-width:0}.image{height:195px}.map{height:320px}.panel{padding:16px}.heading h2{font-size:20px}}
</style></head><body><header class="top"><div class="topin"><div class="brand">О<b>!</b> Journey <small>путешествия под вас</small></div><nav class="nav"><button id="tab-search" class="active" onclick="navigate('search')">Подобрать</button><button id="tab-plan" onclick="navigate('plan')">Моя поездка</button><button id="tab-world" onclick="navigate('world')">Мой мир</button></nav></div></header><main class="wrap" id="app"></main><div id="toast" role="status"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const DATA=[{id:'kazan',name:'Казань',country:'Россия',lat:55.796,long:49.106,tags:['город','еда','культура'],description:'Кулинарные открытия, архитектура и прогулки у воды',img:'https://images.unsplash.com/photo-1576485290814-1c72aa4bbb8e?w=800',hotels:[['Хостел · эконом',1700,'Общая комната, базовые удобства'],['Гостиница · комфорт',3900,'Собственная ванная, рядом с центром'],['Апартаменты · кухня',5100,'Отдельная квартира, самостоятельное питание']],activities:[['Прогулка по историческому центру',750],['Мастер-класс местной кухни',2000],['Экскурсия по музею',1200]],places:[['Казанский кремль',55.7986,49.1064],['Улица Баумана',55.789,49.118],['Центр семьи «Казан»',55.8128,49.1083]],transport:8500},{id:'kaliningrad',name:'Калининград',country:'Россия',lat:54.71,long:20.51,tags:['история','город','море'],description:'Исторические кварталы, Балтийское побережье и необычные музеи',img:'https://images.unsplash.com/photo-1510414842594-a61c69b5ae57?w=800',hotels:[['Гостевой дом · эконом',1900,'Простой номер'],['Отель · комфорт',4300,'Отдельный номер'],['Апартаменты · кухня',5200,'Кухня и пространство']],activities:[['Остров Канта',600],['Экскурсия по городским кварталам',1600],['Поездка на побережье',2400]],places:[['Остров Канта',54.7068,20.5114],['Музей янтаря',54.7229,20.5241],['Рыбная деревня',54.7026,20.5142]],transport:12000},{id:'armenia',name:'Ереван',country:'Армения',lat:40.179,long:44.499,tags:['история','еда','культура'],description:'Творческие кварталы, гастрономия и древние памятники',img:'https://images.unsplash.com/photo-1569949381669-ecf31ae8e613?w=800',hotels:[['Хостел · эконом',2100,'Общая зона, простое размещение'],['Отель · комфорт',4900,'Удобства в номере'],['Апартаменты · кухня',6000,'Кухня и приватность']],activities:[['Экскурсия по Еревану',1500],['Гастрономическая прогулка',2600],['Поездка к памятникам',3800]],places:[['Каскад',40.1906,44.5155],['Площадь Республики',40.1777,44.5125],['Матенадаран',40.1922,44.5211]],transport:29500},{id:'moscow',name:'Москва',country:'Россия',lat:55.7558,long:37.6173,tags:['искусство','город','еда'],description:'Современное искусство, театры, архитектура и гастрономия',img:'https://images.unsplash.com/photo-1513326738677-b964603b136d?w=800',hotels:[['Хостел · эконом',1800,'Базовое размещение'],['Отель · комфорт',5200,'Рядом с метро'],['Апартаменты · кухня',6100,'Отдельное жильё']],activities:[['Музей искусства',1000],['Пешеходная экскурсия',1500],['Гастрономический маршрут',2100]],places:[['ГЭС-2',55.7445,37.6107],['Парк Зарядье',55.751,37.629],['Новая Третьяковка',55.7344,37.6057]],transport:6000},{id:'georgia',name:'Тбилиси',country:'Грузия',lat:41.7151,long:44.8271,tags:['еда','история','город'],description:'Дворики, винтажные улицы, кухни разных регионов',img:'https://images.unsplash.com/photo-1565008576549-57569a49371d?w=800',hotels:[['Гестхаус · эконом',1800,'Небольшой номер'],['Отель · комфорт',5000,'Центральный район'],['Апартаменты · кухня',5700,'Простор и кухня']],activities:[['Пешая экскурсия',1400],['Мастер-класс кухни',2500],['Поездка по окрестностям',3600]],places:[['Крепость Нарикала',41.6879,44.8078],['Мост Мира',41.6931,44.8088],['Серные бани',41.687,44.811]],transport:31000},{id:'uzbekistan',name:'Самарканд',country:'Узбекистан',lat:39.6542,long:66.9597,tags:['история','еда','культура'],description:'Мозаики, ремёсла, восточные рынки и кулинария',img:'https://images.unsplash.com/photo-1566073771259-6a8506099945?w=800',hotels:[['Гостевой дом · эконом',1400,'Семейный формат'],['Отель · комфорт',3700,'Отдельный номер'],['Бутик-отель',6200,'Необычный интерьер']],activities:[['Регистан с гидом',1800],['Мастерская ремёсел',1400],['Гастрономический тур',2200]],places:[['Регистан',39.6548,66.9756],['Гур-Эмир',39.6486,66.9698],['Шахи-Зинда',39.6601,66.9876]],transport:29000}];
const read=()=>{try{return JSON.parse(localStorage.getItem('oj-v5')||'{}')}catch{return {}}};let s={tab:'search',query:'Хочу необычные впечатления на 5 дней. Подбери варианты с жильём и экскурсиями.',budget:45000,days:5,people:2,month:'2026-11',origin:'Санкт-Петербург',selected:'kazan',hotel:1,activities:[0],mood:'balanced',visited:[],feedback:{},...read()};let leaflet=null;const save=()=>{try{localStorage.setItem('oj-v5',JSON.stringify(s))}catch{}};const fmt=n=>Math.round(n).toLocaleString('ru-RU')+' ₽',e=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>x.style.display='none',2700)}function change(k,v){s[k]=v;save();draw()}function navigate(t){s.tab=t;save();draw();scrollTo({top:0,behavior:'smooth'})}function selected(){return DATA.find(x=>x.id===s.selected)||DATA[0]}function totals(d=selected()){const nights=Math.max(1,s.days-1),rooms=Math.ceil(s.people/2),stay=d.hotels[s.hotel][1]*nights*rooms,activities=s.activities.reduce((a,i)=>a+(d.activities[i]?.[1]||0)*s.people,0),transport=d.transport*s.people,food=1100*s.days*s.people,local=1300*s.people;return {stay,activities,transport,food,local,total:stay+activities+transport+food+local}}function choose(id){s.selected=id;s.hotel=1;s.activities=[0];s.tab='plan';save();draw();scrollTo(0,0)}function search(){const q=s.query.toLowerCase();const intents={еда:['еда','кухн','гастрон','вкусн'],искусство:['искусств','музей','выстав'],история:['истор','древн'],город:['город','архитект','улиц'],море:['море','пляж','побереж'],культура:['культур','ремес'],природа:['природ','лес','горы']};const match=Object.entries(intents).filter(([k,words])=>words.some(w=>q.includes(w))).map(([k])=>k);return [...DATA].sort((a,b)=>{const sc=d=>match.filter(k=>d.tags.includes(k)).length*12 + (s.mood==='new'&&!s.visited.includes(d.id)?10:0)+(s.mood==='similar'&&s.visited.includes(d.id)?9:0)-(s.feedback['city:'+d.id]==='dislike'?25:0);return sc(b)-sc(a)})}function analyze(){const b=s.query.match(/(\d{2,3})\s*(?:тыс\.?|тысяч)/i);if(b)s.budget=Number(b[1])*1000;const d=s.query.match(/(\d{1,2})\s*дн/i);if(d)s.days=Math.min(21,Math.max(2,Number(d[1])));save();draw();toast('Варианты отсортированы по запросу. Цены — только демонстрационные.')}function feedback(k,v){s.feedback[k]=s.feedback[k]===v?null:v;save();draw();toast(v==='wish'?'Добавлено в список желаний':v==='like'?'Отмечено как понравившееся':'Предпочтение сохранено')}function buttonFeedback(k){return `<div class="actions"><button class="secondary" onclick="feedback('${k}','wish')">${s.feedback[k]==='wish'?'✓ В планах':'☆ Хочу посетить'}</button><button class="secondary" onclick="feedback('${k}','like')">${s.feedback[k]==='like'?'✓ Понравилось':'♥ Было здорово'}</button><button class="secondary" onclick="feedback('${k}','dislike')">${s.feedback[k]==='dislike'?'✓ Не понравилось':'Не моё'}</button></div>`}function searchView(){return `<section class="hero"><h1>Путешествие начинается с идеи</h1><p>Расскажите, что хочется попробовать, — мы поможем собрать поездку.</p><div class="search"><textarea id="query" aria-label="Ваш запрос">${e(s.query)}</textarea><button class="primary" onclick="s.query=document.getElementById('query').value;analyze()">Подобрать варианты →</button></div></section><div class="filters"><label>Бюджет на человека, ₽<input type="number" min="0" step="1000" value="${s.budget}" onchange="change('budget',Number(this.value))"></label><label>Дней<input type="number" min="2" max="21" value="${s.days}" onchange="change('days',Number(this.value))"></label><label>Путешественников<input type="number" min="1" max="10" value="${s.people}" onchange="change('people',Number(this.value))"></label><label>Месяц<input type="month" value="${s.month}" onchange="change('month',this.value)"></label><label>Что ищем?<select onchange="change('mood',this.value)"><option value="balanced" ${s.mood==='balanced'?'selected':''}>Баланс</option><option value="similar" ${s.mood==='similar'?'selected':''}>Что-то похожее</option><option value="new" ${s.mood==='new'?'selected':''}>Что-то новое</option></select></label></div><div class="heading"><h2>Направления для вас</h2><span class="muted small">Тестовые сценарии, не бронируемые предложения</span></div><div class="grid">${search().map(d=>{let t=(d.transport+1100*s.days+1300+(d.hotels[1][1]*(s.days-1)*Math.ceil(s.people/2))/s.people+d.activities[0][1]);return `<article class="card"><div class="image" style="background-image:url('${d.img}')"></div><div class="content"><span class="pill">${e(d.country)}</span><h3 style="margin-top:9px">${e(d.name)}</h3><p>${e(d.description)}</p><div class="row"><div><span class="muted small">Расчётный пример от</span><div class="price">${fmt(t)} <span class="small muted">/ чел.</span></div></div></div><div class="divider"></div><button class="blue" style="width:100%" onclick="choose('${d.id}')">Посмотреть маршрут и жильё →</button></div></article>`}).join('')}</div>`}
function planView(){const d=selected(),b=totals();return `<div class="heading"><div><span class="muted small">МОЯ ПОЕЗДКА</span><h2>${e(d.name)} · ${s.days} дней</h2><p class="muted">${e(d.description)}</p></div><button class="secondary" onclick="navigate('search')">← Другие направления</button></div><div class="layout"><div><section class="panel"><div class="heading" style="margin-top:0"><h2>Карта и интересные места</h2><span class="pill">Интерактивная</span></div><div class="map" id="map"><div class="map-fallback">Загружаем карту…<small>Если тайлы недоступны, места останутся в списке ниже.</small></div></div><div class="places">${d.places.map((p,i)=>`<button class="place" onclick="focusPlace(${i})">📍 ${e(p[0])}</button>`).join('')}</div><p class="small muted">Нажмите на маркер карты или название, чтобы добавить место в желания. Отзыв не потребуется.</p></section><section class="panel"><h2>Где остановиться</h2><p class="muted">Три формата — разный комфорт и стоимость. Названия и цены сейчас тестовые.</p>${d.hotels.map((h,i)=>`<div class="choice ${i===s.hotel?'selected':''}"><input type="radio" name="hotel" id="h${i}" ${i===s.hotel?'checked':''} onchange="change('hotel',${i})"><label for="h${i}"><strong>${e(h[0])}</strong><div class="detail">${e(h[2])}</div><div class="muted small">${fmt(h[1])} за номер за ночь · демо</div></label></div>`).join('')}</section><section class="panel"><h2>Впечатления и экскурсии</h2><p class="muted">Выберите, что добавить. Стоимость за каждого участника включается в бюджет.</p>${d.activities.map((a,i)=>`<div class="choice ${s.activities.includes(i)?'selected':''}"><input type="checkbox" id="a${i}" ${s.activities.includes(i)?'checked':''} onchange="toggleActivity(${i})"><label for="a${i}"><strong>${e(a[0])}</strong><div class="detail">${fmt(a[1])} / чел. · тестовый тариф</div></label></div>`).join('')}</section><section class="panel"><h2>План по дням</h2>${Array.from({length:s.days},(_,i)=>`<div class="itinerary"><b>День ${i+1}</b><span class="muted">${i===0?'Прибытие, заселение, свободный вечер':i===s.days-1?'Выезд, дорога домой':d.places[(i-1)%d.places.length][0]+(s.activities[i-1]?' · '+s.activities[i-1][0]:' · свободное время')}</span></div>`).join('')}<div class="note">Временные слоты и транспортные стыковки пока не проверены. В конкурсной версии планировщик должен рассчитывать их по реальным данным.</div></section></div><aside class="right"><section class="panel"><span class="pill">Демо-смета</span><h2 style="margin-top:10px">Стоимость поездки</h2>${[['Дорога',b.transport],['Жильё за '+(s.days-1)+' ночи',b.stay],['Экскурсии',b.activities],['Питание (оценка)',b.food],['Местные переезды (оценка)',b.local]].map(r=>`<div class="row" style="margin:11px 0"><span class="muted">${r[0]}</span><strong>${fmt(r[1])}</strong></div>`).join('')}<div class="divider"></div><div class="row"><b>На человека</b><div class="price">${fmt(b.total/s.people)}</div></div><p class="small muted">На всю группу: ${fmt(b.total)}</p><div class="bubble" style="background:${b.total/s.people>s.budget?'#fff1e9':'#edf8ef'};color:${b.total/s.people>s.budget?'#9b4a24':'#2d6b4c'}">${b.total/s.people>s.budget?'Превышение лимита: '+fmt(b.total/s.people-s.budget):'В пределах тестового бюджета. Остаток: '+fmt(s.budget-b.total/s.people)}</div><button class="blue" style="width:100%" onclick="book()">Оформить демо-заказ</button><p class="small muted">Цены и объекты жилья не подтверждены поставщиками. Реальные бронирования недоступны.</p></section><section class="panel"><h3>Погода по источнику</h3><p class="muted small">Проверим выбранный месяц. Дальние даты — исторические наблюдения, не прогноз.</p><button class="secondary" onclick="weather()">Проверить погоду</button><div id="weather" style="margin-top:10px"></div></section></aside></div>`}
function worldView(){const d=selected();return `<div class="heading"><div><h2>Мой мир</h2><p class="muted">Где были, что понравилось и куда хотите поехать</p></div></div><div class="layout"><div><section class="panel"><h2>Посещённые города</h2><div class="places">${DATA.map(x=>`<button class="place ${s.visited.includes(x.id)?'active':''}" onclick="visit('${x.id}')">${s.visited.includes(x.id)?'✓ ':''}${e(x.name)}</button>`).join('')}</div><div class="divider"></div><h2>Места и список желаний</h2><label class="muted">Направление <select style="padding:9px;border-radius:8px;border:1px solid #e6eaf0" onchange="change('selected',this.value)">${DATA.map(x=>`<option value="${x.id}" ${x.id===d.id?'selected':''}>${e(x.name)}</option>`).join('')}</select></label>${d.places.map((p,i)=>`<div class="choice"><div><strong>${e(p[0])}</strong><div class="small muted" style="margin:6px 0">Отметьте желание или впечатление отдельно</div>${buttonFeedback('place:'+d.id+':'+i)}</div></div>`).join('')}</section><section class="panel"><h2>Как использовать память</h2><p>При подборе можно выбрать похожие направления, совершенно новые или баланс. Понравившиеся места и сохранённые желания не смешиваются: сохранение не считается положительным отзывом.</p><button class="blue" onclick="navigate('search')">Найти новое путешествие →</button></section></div><aside><section class="panel"><h3>Мой список желаний</h3>${Object.entries(s.feedback).filter(([k,v])=>v==='wish').map(([k])=>`<div class="bubble">${e(k.startsWith('place:')?(()=>{let [,id,i]=k.split(':');return DATA.find(d=>d.id===id)?.places[Number(i)]?.[0]||k})():k)}</div>`).join('')||'<p class="muted">Пока пусто. Отметьте места на карте или здесь.</p>'}</section></aside></div>`}
function visit(id){s.visited=s.visited.includes(id)?s.visited.filter(x=>x!==id):[...s.visited,id];save();draw()}function toggleActivity(i){s.activities=s.activities.includes(i)?s.activities.filter(x=>x!==i):[...s.activities,i];save();draw()}function book(){toast('Создан демонстрационный сценарий. Реальной оплаты и бронирования нет.')}function focusPlace(i){let d=selected(),p=d.places[i];if(leaflet){leaflet.setView([p[1],p[2]],14)}feedback('place:'+d.id+':'+i,'wish')}
function makeMap(){if(s.tab!=='plan')return;let el=document.getElementById('map');if(!el)return;if(!window.L){el.innerHTML='<div class="map-fallback"><b>Карта недоступна без подключения к интернету.</b><p>Места можно выбрать в списке ниже.</p></div>';return}try{leaflet=L.map(el).setView([selected().lat,selected().long],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(leaflet);selected().places.forEach((p,i)=>L.marker([p[1],p[2]]).addTo(leaflet).bindPopup(`<b>${e(p[0])}</b><br><button onclick="feedback('place:${selected().id}:${i}','wish')">☆ Хочу посетить</button>`));setTimeout(()=>leaflet.invalidateSize(),150)}catch(err){el.innerHTML='<div class="map-fallback">Не удалось загрузить карту; места доступны в списке.</div>';console.error(err)}}async function weather(){const el=document.getElementById('weather');el.textContent='Получаем данные…';try{const date=s.month+'-15',r=await fetch('/api/weather/'+s.selected+'?departure='+date);if(!r.ok)throw new Error('Источник недоступен');const d=await r.json();el.innerHTML=`<strong>${d.mode==='forecast'?'Прогноз':'Исторические наблюдения'}</strong><p>${e(d.date)} · ${e(d.city)}</p><p>${e(d.metrics.temperature_2m_min)}…${e(d.metrics.temperature_2m_max)} °C · осадки ${e(d.metrics.precipitation_sum)} мм</p><p class="small muted">${e(d.explanation)} · Open-Meteo</p>`}catch{el.innerHTML='<p class="small muted">Не удалось получить погодные данные. Проверьте подключение backend и повторите.</p>'}}function draw(){if(leaflet){try{leaflet.remove()}catch{}leaflet=null}document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.id==='tab-'+s.tab));document.getElementById('app').innerHTML=({search:searchView,plan:planView,world:worldView})[s.tab]();makeMap()}draw();
</script></body></html>
